# ============================================================
# 飞机大战（React SPA）Nginx 部署配置
# 用法：
#   1. 将 react-app/dist 目录内容上传到服务器，例如 /var/www/react-app
#   2. 修改下方 root 和 server_name 为实际值
#   3. 将本文件复制到 Nginx 配置目录（如 /etc/nginx/conf.d/react-app.conf）
#   4. 校验并重载：nginx -t && nginx -s reload
# ============================================================
server {
    listen       80;
    server_name  localhost;            # 改成你的域名或服务器 IP

    root   /var/www/react-app;         # 改成 dist 上传后的绝对路径
    index  index.html;

    # SPA 回退：/game、/about 等前端路由刷新时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带内容哈希的静态资源：长缓存（文件名变了缓存自动失效）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 入口 HTML 不缓存，保证每次发版立即生效
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # gzip 压缩（JS/CSS 传输体积可减少约 70%）
    gzip              on;
    gzip_min_length   1k;
    gzip_comp_level   5;
    gzip_vary         on;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;
}
